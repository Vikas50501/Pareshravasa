<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" role="img" aria-labelledby="title desc">
  <title id="title">LIC 1.2</title>
  <desc id="desc">Placeholder Litigation Insight Card for Tax Litigation Insight No - 1.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f9fd"/>
      <stop offset="100%" stop-color="#e8eef9"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c3170"/>
      <stop offset="100%" stop-color="#2f4fa6"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1250" fill="url(#bg)"/>
  <rect x="60" y="60" width="880" height="1130" rx="36" fill="#fff" stroke="#d8e1f0"/>
  <rect x="60" y="60" width="880" height="260" rx="36" fill="url(#panel)"/>
  <circle cx="830" cy="160" r="102" fill="rgba(255,255,255,0.08)"/>
  <circle cx="770" cy="230" r="58" fill="rgba(255,255,255,0.12)"/>
  <text x="110" y="150" fill="#c8a84b" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="6">LITIGATION INSIGHT CARD</text>
  <text x="110" y="214" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700">LIC 1.2</text>
  <text x="110" y="265" fill="#dfe8ff" font-family="Arial, Helvetica, sans-serif" font-size="26">Tax Litigation Insight No - 1</text>
  <text x="110" y="430" fill="#1c3170" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Card Preview</text>
  <text x="110" y="490" fill="#51607f" font-family="Arial, Helvetica, sans-serif" font-size="24">Replace this placeholder with the uploaded LIC artwork.</text>
