  <rect x="110" y="620" width="780" height="2" fill="#dfe6f2"/>
  <text x="110" y="700" fill="#1c3170" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Related TLI</text>
  <text x="110" y="750" fill="#51607f" font-family="Arial, Helvetica, sans-serif" font-size="24">Tax Litigation Insight No - 1</text>
  <text x="110" y="830" fill="#1c3170" font-family="Arial, Helvetica, sans-serif" font-size="24">Open the article from the button below the card.</text>
